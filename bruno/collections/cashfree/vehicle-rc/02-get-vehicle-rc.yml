info:
  name: get-vehicle-rc
  type: http
  seq: 2

http:
  method: GET
  url: "{{cashfreeBaseUrl}}/vehicle-rc?verification_id={{cashfreeRcVerificationId}}"
  params:
    - name: verification_id
      value: "{{cashfreeRcVerificationId}}"
      type: query

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 01's verification", function () {
          const body = res.getBody();
          expect(body.verification_id, JSON.stringify(body)).to.equal(bru.getVar("cashfreeRcVerificationId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  `GET /vehicle-rc` by the `verification_id` that 01 stored in the runtime var `cashfreeRcVerificationId`. Not billed as a new lookup per the docs' status-check wording; confirm with Cashfree.
