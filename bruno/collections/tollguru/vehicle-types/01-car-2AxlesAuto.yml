info:
  name: car-2AxlesAuto
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/complete-polyline-from-mapping-service"
  body:
    type: json
    data: |-
      {
        "polyline": "{{tollguruPolyline}}",
        "vehicle": { "type": "2AxlesAuto" },
        "units": { "currency": "{{tollguruCurrency}}" }
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("TollGuru accepted 2AxlesAuto", function () {
          expect(res.getBody().summary.vehicleType).to.equal("2AxlesAuto");
        });

        test("route has a tag cost", function () {
          expect(res.getBody().route.costs.tag, JSON.stringify(res.getBody().route.costs)).to.be.a("number");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "`2AxlesAuto`, what plutus sends for VC4, VC04, VC20 (car)."
