opencollection: 1.0.0

info:
  name: knowlarity
  version: "1"

request:
  headers:
    - name: x-api-key
      value: "{{process.env.KNOWLARITY_CALL_LOG_KEY}}"

docs:
  content: |-
    # Knowlarity call-log push (logPUSH)

    Knowlarity (a Gupshup company) runs our inbound IVR numbers. After each call it **pushes** the
    call log to our CRM webhook, `https://crm.vahn.in/webhooks/knowlarity/call-log`. Knowlarity
    offers no pull API here: call history for a number is whatever the CRM stored from these pushes.
    Source: Knowlarity tickets "#00959898 Support required to change IVR flow" and
    "Align DM_for Script and API configuration" (Sep–Oct 2026).

    These requests play Knowlarity's side, so you can check the webhook's contract and auth.
    **Every successful call stores a call log in the live CRM.** The payload uses dummy numbers
    and a `knowlarity-test-<timestamp>` `call_uuid`, so test rows are easy to spot and delete.

    ## Credentials

    The webhook checks an `x-api-key` header. Without it, it answers 401 (what Knowlarity hit on
    2026-10-22). Read from `bruno/collections/knowlarity/.env` (gitignored):

    ```
    KNOWLARITY_CALL_LOG_KEY=<the x-api-key Akul shared with Knowlarity on 2026-10-22>
    ```

    ```bash
    npx @usebruno/cli run bruno/collections/knowlarity --env staging
    ```

    ## Payload (Knowlarity's spec)

    | field | type | required | notes |
    |---|---|---|---|
    | call_date | date | yes | `YYYY-MM-DD` |
    | call_time | time | yes | call start, `HH:mm:ss` |
    | call_direction | string | yes | `incoming` |
    | customer_number | string | yes | caller, `+91XXXXXXXXXX` |
    | called_number | string | no | Knowlarity number, `+91…` |
    | call_duration | time | yes | total, `HH:mm:ss` |
    | call_transfer_duration | time | no | agent talk time |
    | call_uuid | string | yes | unique per call, generated by Knowlarity |
    | call_status | string | yes | customer leg (A) status |
    | call_transfer_status | string | no | agent leg (B): Connected / Missed / Not Connected |
    | agent_list | string | no | agents tried |
    | agent_number | string | no | agent number if Connected; `False` if Missed; `None` if not tried |
    | menu | string | no | DTMF pressed, default `None` |
    | client_variable_1..3 | string | no | client-specific |

    Call recording URL: requested from Knowlarity; field name not confirmed yet (as of 2026-10-23).

    Responses: `{"status": "success", "request_id": "<uuid>"}`, `text/plain`, HTTP 200.
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
