info:
  name: push-get
  type: http
  seq: 3

http:
  method: GET
  url: "{{knowlarityBaseUrl}}/webhooks/knowlarity/call-log?call_date={{knowlarityCallDate}}&call_time={{knowlarityCallTime}}&call_direction=incoming&customer_number={{knowlarityCustomerNumber}}&called_number={{knowlarityCalledNumber}}&call_duration=00:00:08&call_uuid={{knowlarityCallUuid}}&call_status=Missed&menu=None"

runtime:
  scripts:
    - type: tests
      code: |-
        test("webhook accepted the call log", function () {
          const body = typeof res.getBody() === "string" ? JSON.parse(res.getBody()) : res.getBody();
          expect(res.getStatus(), JSON.stringify(body)).to.equal(200);
          expect(body.status).to.equal("success");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: GET with the fields in the query string (Knowlarity's logPUSH supports GET). `+` is URL-encoded by Bruno.
