name: E2E

# End-to-end checks for the fleet-owner journey (sign-up, KYC, add truck,
# create trip) across plutus-java, perseus and atlas-rn. Every job runs
# e2e/run.sh, the same entry point developers use locally; see e2e/README.md.
#
# Called three ways:
#   - by the thin e2e.yml in each app repo, on its pull requests (workflow_call)
#   - nightly against the integration branches (schedule)
#   - by hand, with any combination of refs and suites (workflow_dispatch)
#
# Where jobs run is set by repository variables, so moving a suite between
# GitHub-hosted runners, the Oracle arm64 VMs and a Mac needs no code change:
#   E2E_RUNNER_BACKEND   build + API suite          default "ubuntu-latest"
#   E2E_RUNNER_WEB       perseus (Maestro web)      default "ubuntu-latest"
#   E2E_RUNNER_MOBILE    atlas-rn (Android emulator) default "ubuntu-latest"
# Each is a JSON value: "ubuntu-latest" or ["self-hosted","linux","arm64","e2e"].
#
# Secret E2E_REPO_TOKEN: read access to plutus-java, perseus and atlas-rn
# contents (fine-grained PAT or GitHub App token).

on:
  workflow_call:
    inputs:
      plutus_ref:
        type: string
        default: develop
      perseus_ref:
        type: string
        default: main
      atlas_ref:
        type: string
        default: main
      themis_ref:
        description: Ref of this repo to take the tests and runner from
        type: string
        default: main
      suites:
        description: Space-separated suites to run (api web mobile)
        type: string
        default: api web mobile
    secrets:
      E2E_REPO_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      plutus_ref:
        description: plutus-java branch, tag or SHA
        default: develop
      perseus_ref:
        description: perseus branch, tag or SHA
        default: main
      atlas_ref:
        description: atlas-rn branch, tag or SHA
        default: main
      suites:
        description: Space-separated suites to run (api web mobile)
        default: api web mobile
  schedule:
    # 02:30 IST, after the day's merges.
    - cron: "0 21 * * *"
  pull_request:
    paths:
      - "e2e/**"
      - "bruno/flows/plutus-api/fleet-onboarding/**"
      - "bruno/flows/plutus-api/environments/e2e.bru"
      - "maestro/**"
      - ".github/workflows/e2e.yml"

# One run per caller ref; a newer push to the same PR replaces the older run.
concurrency:
  group: e2e-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.suites || 'all' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ORG: Vahn-Engineering
  # Inside a reusable workflow github.repository is the *caller's* repo, so the
  # home of the tests is spelled out.
  THEMIS_REPO: Vahn-Engineering/themis
  PLUTUS_REF: ${{ inputs.plutus_ref || 'develop' }}
  PERSEUS_REF: ${{ inputs.perseus_ref || 'main' }}
  ATLAS_REF: ${{ inputs.atlas_ref || 'main' }}
  # When called from another repo, github.ref is the caller's; take themis
  # from the ref the caller named. On themis' own events, use what triggered.
  THEMIS_REF: ${{ inputs.themis_ref || github.event.pull_request.head.sha || github.ref }}
  SUITES: ${{ inputs.suites || 'api web mobile' }}
  MAESTRO_VERSION: "2.11.0"
  # Checkout layout the runner script expects: the repos side by side.
  PLUTUS_DIR: ${{ github.workspace }}/plutus-java
  PERSEUS_DIR: ${{ github.workspace }}/perseus
  ATLAS_DIR: ${{ github.workspace }}/atlas-rn
  E2E_SKIP_IS_FAILURE: "1"

jobs:
  backend:
    name: Build backend
    runs-on: ${{ fromJSON(vars.E2E_RUNNER_BACKEND || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.ORG }}/plutus-java
          ref: ${{ env.PLUTUS_REF }}
          token: ${{ secrets.E2E_REPO_TOKEN }}
          path: plutus-java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: plutus-java/pom.xml
      - name: Build plutus-api
        working-directory: plutus-java
        run: mvn -q -B -DskipTests package
      - uses: actions/upload-artifact@v4
        with:
          name: plutus-jar
          path: plutus-java/target/plutus-1.0-SNAPSHOT.jar
          retention-days: 1
          if-no-files-found: error

  api:
    name: API (Bruno)
    needs: backend
    if: ${{ contains(inputs.suites || 'api web mobile', 'api') }}
    runs-on: ${{ fromJSON(vars.E2E_RUNNER_BACKEND || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.THEMIS_REPO }}
          ref: ${{ env.THEMIS_REF }}
          token: ${{ secrets.E2E_REPO_TOKEN }}
          path: themis
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.ORG }}/plutus-java
          ref: ${{ env.PLUTUS_REF }}
          token: ${{ secrets.E2E_REPO_TOKEN }}
          path: plutus-java
      - uses: actions/download-artifact@v4
        with:
          name: plutus-jar
          path: plutus-java/target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run
        env:
          E2E_SKIP_BACKEND_BUILD: "1"
          E2E_PROJECT: e2e-${{ github.run_id }}-api
        run: themis/e2e/run.sh all api
      - name: Publish results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-api
          path: themis/e2e/.run
          retention-days: 14
          include-hidden-files: true

  web:
    name: Web (Maestro, perseus)
    needs: backend
    if: ${{ contains(inputs.suites || 'api web mobile', 'web') }}
    runs-on: ${{ fromJSON(vars.E2E_RUNNER_WEB || '"ubuntu-latest"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.THEMIS_REPO }}
          ref: ${{ env.THEMIS_REF }}
          token: ${{ secrets.E2E_REPO_TOKEN }}
          path: themis
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.ORG }}/plutus-java
          ref: ${{ env.PLUTUS_REF }}
          token: ${{ secrets.E2E_REPO_TOKEN }}
          path: plutus-java
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.ORG }}/perseus
          ref: ${{ env.PERSEUS_REF }}
          token: ${{ secrets.E2E_REPO_TOKEN }}
          path: perseus
      - uses: actions/download-artifact@v4
        with:
          name: plutus-jar
          path: plutus-java/target
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: perseus/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Run
        env:
          # The backend JAR comes from the build job; perseus is built here.
          E2E_SKIP_BACKEND_BUILD: "1"
          E2E_PROJECT: e2e-${{ github.run_id }}-web
        run: themis/e2e/run.sh all web
      - name: Publish results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web
          path: themis/e2e/.run
          retention-days: 14
          include-hidden-files: true

  mobile:
    name: Mobile (Maestro, atlas-rn)
    needs: backend
    if: ${{ contains(inputs.suites || 'api web mobile', 'mobile') }}
    runs-on: ${{ fromJSON(vars.E2E_RUNNER_MOBILE || '"ubuntu-latest"') }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.THEMIS_REPO }}
          ref: ${{ env.THEMIS_REF }}
          token: ${{ secrets.E2E_REPO_TOKEN }}
          path: themis
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.ORG }}/plutus-java
          ref: ${{ env.PLUTUS_REF }}
          token: ${{ secrets.E2E_REPO_TOKEN }}
          path: plutus-java
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.ORG }}/atlas-rn
          ref: ${{ env.ATLAS_REF }}
          token: ${{ secrets.E2E_REPO_TOKEN }}
          path: atlas-rn
      - uses: actions/download-artifact@v4
        with:
          name: plutus-jar
          path: plutus-java/target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # atlas-rn commits no lockfile, so key the dependency and Gradle caches
      # on package.json; a cache hit also pins the resolved versions until
      # package.json next changes.
      - uses: actions/cache@v4
        with:
          path: |
            atlas-rn/node_modules
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cache/atlas-e2e
          key: atlas-e2e-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('atlas-rn/package.json') }}

      # GitHub-hosted Linux: the emulator needs KVM, and the action boots one
      # for the duration of the script. run.sh finds the attached device.
      - name: Enable KVM
        if: ${{ runner.os == 'Linux' && runner.environment == 'github-hosted' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run (hosted emulator)
        if: ${{ runner.os == 'Linux' && runner.environment == 'github-hosted' }}
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_SKIP_BACKEND_BUILD: "1"
          E2E_PROJECT: e2e-${{ github.run_id }}-mobile
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          # The action runs each line in its own shell: keep this to one line.
          script: themis/e2e/run.sh all mobile

      # Self-hosted (a Mac today, the Mac mini later): the machine has its own
      # SDK and emulator image, and run.sh boots and stops it.
      - name: Run (self-hosted emulator)
        if: ${{ runner.environment != 'github-hosted' }}
        env:
          E2E_SKIP_BACKEND_BUILD: "1"
          E2E_PROJECT: e2e-${{ github.run_id }}-mobile
        run: themis/e2e/run.sh all mobile

      - name: Publish results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-mobile
          path: |
            themis/e2e/.run
            !themis/e2e/.run/mobile/*.apk
          retention-days: 14
          include-hidden-files: true
